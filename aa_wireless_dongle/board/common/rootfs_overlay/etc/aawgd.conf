#!/bin/sh

######## Configuration options for Android Auto Wireless Dongle ########

## Country code (ISO/IEC 3166-1)
## Set the regulatory domain for the wifi network. This will help configure the wifi correctly for the country you're in.
AAWG_COUNTRY_CODE=IN


## Set the connection strategy to use
## 0 - Dongle mode. Waits for both dongle and headunit bluetooth connections and then starts the wifi and usb connections.
## 1 - Phone first (default). Waits for the phone bluetooth and wifi to connect first, and then starts the usb connection.
## 2 - Usb first. Waits for the usb to connect first, and then starts the bluetooth and wifi connection with phone.
AAWG_CONNECTION_STRATEGY=1


## Override bluetooth name suffix
## Set a custom suffix to replace unique id used in "WirelessAADongle-<suffix>" or "AndroidAuto-Dongle-<suffix>"
#AAWG_UNIQUE_NAME_SUFFIX=


## Preferred phone
## Bluetooth MAC address of the phone to connect first. Useful in a household
## with multiple paired phones: the driver's phone connects faster and the
## dongle won't grab a passenger's phone. Format: AA:BB:CC:DD:EE:FF
#AAWG_PREFERRED_DEVICE=



######## Advanced Configuration ########

## Override Wifi Password
## Set a custom password for the wifi network.
## This is usually only required when you're debugging the dongle. Not recommended for normal use.
#AAWG_WIFI_PASSWORD=ConnectAAWirelessDongle


## Override Wifi SSID
## Set a custom SSID (network name) for the dongle's wifi network.
## Default: AAWirelessDongle
#AAWG_WIFI_SSID=AAWirelessDongle


## Override Wifi BSSID
## Set a custom BSSID (MAC address) advertised to the phone.
## Defaults to the wlan0 hardware MAC address.
#AAWG_WIFI_BSSID=


## Override proxy IP address
## IP address the dongle's wifi access point serves on.
## Default: 10.0.0.1
#AAWG_PROXY_IP_ADDRESS=10.0.0.1


## Override proxy port
## TCP port the dongle's Android Auto proxy listens on.
## Default: 5288
#AAWG_PROXY_PORT=5288


## Wifi band
## Force the access point onto a specific band: 2.4 or 5.
## 5GHz gives noticeably lower latency and smoother maps/video, but only
## works on boards with a 5GHz-capable wifi radio (e.g. Raspberry Pi 4).
## If unset, the per-board default is used.
#AAWG_WIFI_BAND=5


## Wifi channel
## Force a specific channel. If unset, a sensible default for the band is
## used (channel 6 for 2.4GHz, channel 36 for 5GHz).
#AAWG_WIFI_CHANNEL=36



######## Head unit compatibility ########
## Some head units are picky about USB timing and descriptors. The options
## below can be tuned to improve compatibility. The defaults work for most
## cars; only change these if the head unit fails to detect the dongle.

## USB gadget switch delay (milliseconds)
## Time the USB gadget is held disabled while switching to accessory mode.
## Increase (e.g. 250 or 500) if the head unit does not pick up the dongle.
## Default: 100
#AAWG_GADGET_SWITCH_DELAY_MS=100


## USB descriptor strings
## Identity the dongle presents to the head unit over USB.
#AAWG_USB_SERIAL_NUMBER=0123456
#AAWG_USB_MANUFACTURER=My Own
#AAWG_USB_PRODUCT=AA Wireless Dongle


## Status LED
## Name of an LED under /sys/class/leds to use as a status indicator on the
## otherwise headless dongle. On a Raspberry Pi the onboard green LED is
## usually "ACT". Patterns: slow blink = waiting for phone, solid = connected,
## fast blink = error. Leave unset to keep the LED's default behaviour.
#AAWG_STATUS_LED=ACT


## Enable SSH
## Enable SSH server to login and access the dongle's command prompt.
## This is usually only required when you're debugging the dongle. Not recommended for normal use.
#AAWG_ENABLE_SSH=1


## Persistent log
## Write the daemon log to /persist/aawgd.log (and .log.1) so it survives a
## power-cycle. Useful for diagnosing intermittent connection drops.
## Set to 1 to enable. Not recommended for normal use.
#AAWG_PERSIST_LOG=1
